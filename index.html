<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sudoku</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #f5f5f5;
            margin: 0;
            padding: 30px 10px;
        }

        h1 {
            margin-bottom: 15px;
        }

        button {
            padding: 10px 22px;
            font-size: 17px;
            cursor: pointer;
            margin-bottom: 20px;
        }

        #board {
            display: grid;
            grid-template-columns: repeat(9, 45px);
            grid-template-rows: repeat(9, 45px);

            width: 405px;
            height: 405px;

            margin: 0 auto;

            border: 3px solid black;
            background: white;
        }

        .cell {
            width: 45px;
            height: 45px;

            box-sizing: border-box;

            border: 1px solid #999;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 22px;
            font-weight: normal;
        }

        .given {
            font-weight: bold;
            background: #eeeeee;
        }

        /* Thick vertical lines between 3x3 boxes */
        .cell:nth-child(3n) {
            border-right: 2px solid black;
        }

        /* Thick horizontal lines between 3x3 boxes */
        .cell:nth-child(n+19):nth-child(-n+27),
        .cell:nth-child(n+46):nth-child(-n+54) {
            border-bottom: 2px solid black;
        }

        @media (max-width: 500px) {
            #board {
                grid-template-columns: repeat(9, 35px);
                grid-template-rows: repeat(9, 35px);

                width: 315px;
                height: 315px;
            }

            .cell {
                width: 35px;
                height: 35px;
                font-size: 18px;
            }
        }
    </style>
</head>

<body>

    <h1>Sudoku</h1>

    <button onclick="newGame()">New Game</button>

    <div id="board">

        <div class="cell given">5</div>
        <div class="cell given">3</div>
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell given">7</div>
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>

        <div class="cell given">6</div>
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell given">1</div>
        <div class="cell given">9</div>
        <div class="cell given">5</div>
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>

        <div class="cell"></div>
        <div class="cell given">9</div>
        <div class="cell given">8</div>
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell given">6</div>
        <div class="cell"></div>

        <div class="cell given">8</div>
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell given">6</div>
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell given">3</div>

        <div class="cell given">4</div>
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell given">8</div>
        <div class="cell"></div>
        <div class="cell given">3</div>
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell given">1</div>

        <div class="cell given">7</div>
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell given">2</div>
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell given">6</div>

        <div class="cell"></div>
        <div class="cell given">6</div>
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell given">2</div>
        <div class="cell given">8</div>
        <div class="cell"></div>

        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell given">4</div>
        <div class="cell given">1</div>
        <div class="cell given">9</div>
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell given">5</div>

        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell given">8</div>
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell given">7</div>
        <div class="cell given">9</div>

    </div>

    <script>
    const solution = [
        [5,3,4,6,7,8,9,1,2],
        [6,7,2,1,9,5,3,4,8],
        [1,9,8,3,4,2,5,6,7],
        [8,5,9,7,6,1,4,2,3],
        [4,2,6,8,5,3,7,9,1],
        [7,1,3,9,2,4,8,5,6],
        [9,6,1,5,3,7,2,8,4],
        [2,8,7,4,1,9,6,3,5],
        [3,4,5,2,8,6,1,7,9]
    ];

    const cells = document.querySelectorAll(".cell:not(.given)");

    cells.forEach(function(cell) {

        cell.contentEditable = true;

        cell.addEventListener("input", function() {

            let value = cell.textContent.trim();

            // Allow only one number from 1 to 9
            if (!/^[1-9]$/.test(value)) {
                cell.textContent = "";
                cell.style.color = "";
                return;
            }

            // Find which cell this is
            const allCells = Array.from(document.querySelectorAll(".cell"));
            const index = allCells.indexOf(cell);

            const row = Math.floor(index / 9);
            const col = index % 9;

            // Check the answer
            if (Number(value) === solution[row][col]) {
                cell.style.color = "black";
            } else {
                cell.style.color = "red";
            }
        });
    });

    function newGame() {
        alert("New Game will be added next.");
    }
</script>
</body>
</html>
