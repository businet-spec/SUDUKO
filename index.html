<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sudoku</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #f5f5f5;
            margin: 0;
            padding: 30px 10px;
        }

        h1 {
            margin-bottom: 10px;
        }

        #board {
            display: grid;
            grid-template-columns: repeat(9, 45px);
            grid-template-rows: repeat(9, 45px);
            width: 405px;
            margin: 20px auto;
            border: 3px solid black;
            background: white;
        }

        .cell {
            width: 45px;
            height: 45px;
            box-sizing: border-box;
            border: 1px solid #999;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            cursor: pointer;
        }

        .cell:nth-child(3n) {
            border-right: 2px solid black;
        }

        .cell:nth-child(n+19):nth-child(-n+27),
        .cell:nth-child(n+46):nth-child(-n+54) {
            border-bottom: 2px solid black;
        }

        .given {
            font-weight: bold;
            background: #eeeeee;
        }

        .selected {
            background: #dceeff;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            margin: 5px;
        }

        @media (max-width: 500px) {
            #board {
                grid-template-columns: repeat(9, 35px);
                grid-template-rows: repeat(9, 35px);
                width: 315px;
            }

            .cell {
                width: 35px;
                height: 35px;
                font-size: 18px;
            }
        }
    </style>
</head>

<body>

    <h1>Sudoku</h1>

    <button onclick="newGame()">New Game</button>

    <div id="board"></div>

    <script>
        const puzzle = [
            [5, 3, 0, 0, 7, 0, 0, 0, 0],
            [6, 0, 0, 1, 9, 5, 0, 0, 0],
            [0, 9, 8, 0, 0, 0, 0, 6, 0],
            [8, 0, 0, 0, 6, 0, 0, 0, 3],
            [4, 0, 0, 8, 0, 3, 0, 0, 1],
            [7, 0, 0, 0, 2, 0, 0, 0, 6],
            [0, 6, 0, 0, 0, 0, 2, 8, 0],
            [0, 0, 0, 4, 1, 9, 0, 0, 5],
            [0, 0, 0, 0, 8, 0, 0, 7, 9]
        ];

        function createBoard() {
            const board = document.getElementById("board");
            board.innerHTML = "";

            for (let row = 0; row < 9; row++) {
                for (let col = 0; col < 9; col++) {

                    const cell = document.createElement("div");
                    cell.className = "cell";

                    if (puzzle[row][col] !== 0) {
                        cell.textContent = puzzle[row][col];
                        cell.classList.add("given");
                    } else {
                        cell.textContent = "";
                        cell.contentEditable = true;
                    }

                    board.appendChild(cell);
                }
            }
        }

        function newGame() {
            createBoard();
        }
createBoard();
